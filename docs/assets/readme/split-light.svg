#E8F55A"/><text x="90" y="258" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">task contracts and their briefs</text><circle cx="76" cy="280" r="3" fill="#E8F55A"/><text x="90" y="285" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">memory notes and the hot set</text><circle cx="76" cy="307" r="3" fill="#E8F55A"/><text x="90" y="312" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">context sources (read through ctx)</text><circle cx="76" cy="334" r="3" fill="#E8F55A"/><text x="90" y="339" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">wake queues, holds, the journal</text><circle cx="76" cy="361" r="3" fill="#E8F55A"/><text x="90" y="366" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">deliverables, decisions, learnings</text><rect x="632" y="128" width="520" height="270" rx="0" fill="#E3E3D9" stroke="#FA5A00" stroke-width="1.6"/><circle cx="654" cy="151" r="1.8" fill="#B84300"/><circle cx="654" cy="159" r="1.8" fill="#B84300"/><circle cx="659" cy="155" r="1.8" fill="#B84300"/><text x="668" y="160" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#B84300" text-anchor="start" letter-spacing="0.14em">HARNESSES OWN</text><text x="654" y="196" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#101010" text-anchor="start">Compute + interface</text><circle cx="660" cy="226" r="3" fill="#FA5A00"/><text x="674" y="231" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">model turns and inference</text><circle cx="660" cy="253" r="3" fill="#FA5A00"/><text x="674" y="258" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">tool execution (full access by default)</text><circle cx="660" cy="280" r="3" fill="#FA5A00"/><text x="674" y="285" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">their own memory and subsystems: a cache</text><circle cx="660" cy="307" r="3" fill="#FA5A00"/><text x="674" y="312" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">the composer the captain types in</text><circle cx="660" cy="334" r="3" fill="#FA5A00"/><text x="674" y="339" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">Claude Code · Codex · T3 Code · …</text><circle cx="660" cy="361" r="3" fill="#FA5A00"/><text x="674" y="366" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#101010" text-anchor="start">replaceable: 10× better = UNVRS 10× better</text><rect x="560" y="230" width="80" height="64" rx="0" fill="#ECECE4" stroke="#B9B9AE" stroke-width="1.2"/><text x="600" y="258" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5C5C55" text-anchor="middle" letter-spacing="0.14em">BRIDGE</text><text x="600" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#101010" text-anchor="middle">plugin</text><text x="48" y="446" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#101010" text-anchor="start">“A harness can use anything it has, its own memory and tools included.</text><text x="48" y="474" font-family="'Helvetica Neue', Helvetica, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5A6200" text-anchor="start">Job context must never live only inside the harness; UNVRS holds the copy of record.”</text><text x="1152" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5C5C55" text-anchor="end">docs/design/context-ownership.md</text></svg>
